<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado | Milo Concept</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;700;800&display=swap"
        rel="stylesheet">
    <style>
        body { background: #FAFAFA; }
        .status-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }
        .status-card {
            background: #fff;
            padding: 60px 40px;
            max-width: 520px;
            width: 100%;
            border-radius: 14px;
            border-top: 3px solid #353535;
            box-shadow: 0 26px 70px rgba(45, 35, 25, 0.10);
        }
        .status-icon {
            font-size: 3rem;
            margin-bottom: 24px;
            line-height: 1;
        }
        .status-icon.ok { color: #2e7d32; }
        .status-icon.pending { color: #f59e0b; }
        .status-icon.error { color: #c62828; }
        .status-card h1 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 400;
            font-size: 2.4rem;
            margin-bottom: 12px;
        }
        .status-card p { color: #555; margin-bottom: 12px; }
        .status-card .meta { font-size: 0.85rem; color: #888; margin-top: 20px; }
        .status-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 32px;
            flex-wrap: wrap;
        }
        .btn-outline, .btn-solid {
            display: inline-block;
            padding: 14px 32px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            border-radius: 999px;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .btn-solid { background: #353535; color: #fff; }
        .btn-solid:hover { background: #000; }
        .btn-outline { border: 1px solid #353535; color: #353535; }
        .btn-outline:hover { background: #353535; color: #fff; }
        .spinner {
            width: 28px; height: 28px;
            border: 2px solid #e5e5e5;
            border-top-color: #353535;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <main class="status-page">
        <div class="status-card" id="card">
            <div class="spinner" id="spinner"></div>
            <h1>Confirmando tu pago</h1>
            <p id="status-msg">Estamos verificando con Mercado Pago...</p>
            <p class="meta" id="meta"></p>
        </div>
    </main>

    <script>
        (async function () {
            const card = document.getElementById('card');
            const spinner = document.getElementById('spinner');
            const msg = document.getElementById('status-msg');
            const meta = document.getElementById('meta');

            const params = new URLSearchParams(window.location.search);
            const paymentId = params.get('payment_id') || params.get('collection_id');
            const paymentStatus = params.get('status') || params.get('collection_status');

            // Backup of cart in case user navigates back — we don't need it anymore for server,
            // but we DO want to clear it now that the payment URL came back from MP.
            const clearCart = () => {
                try {
                    localStorage.removeItem('cart');
                    localStorage.removeItem('cart_backup');
                } catch (_) {}
            };

            const renderError = (text) => {
                spinner.remove();
                card.innerHTML = `
                    <div class="status-icon error">!</div>
                    <h1>Algo salió mal</h1>
                    <p>${text}</p>
                    <div class="status-actions">
                        <a href="shop.html" class="btn-solid">Volver a la Tienda</a>
                    </div>
                `;
            };

            const renderPending = () => {
                spinner.remove();
                card.innerHTML = `
                    <div class="status-icon pending">⏳</div>
                    <h1>Pago Pendiente</h1>
                    <p>Tu pago está siendo procesado. Te enviaremos un correo en cuanto se confirme.</p>
                    <div class="status-actions">
                        <a href="index.html" class="btn-outline">Inicio</a>
                        <a href="account.html" class="btn-solid">Mis Pedidos</a>
                    </div>
                `;
            };

            const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));

            const renderSuccess = (order) => {
                clearCart();
                spinner.remove();
                card.innerHTML = `
                    <div class="status-icon ok">✓</div>
                    <h1>¡Gracias por tu compra!</h1>
                    <p>Tu pedido <strong>#${Number(order.id) || ''}</strong> ha sido confirmado.</p>
                    <p>Te enviamos el recibo a <strong>${esc(order.email || 'tu correo')}</strong>.</p>
                    <p class="meta">Total: $${Number(order.total).toFixed(2)} MXN</p>
                    <div class="status-actions">
                        <a href="shop.html" class="btn-outline">Seguir Comprando</a>
                        <a href="account.html" class="btn-solid">Mis Pedidos</a>
                    </div>
                `;
            };

            if (!paymentId) {
                renderError('No recibimos información del pago.');
                return;
            }
            if (paymentStatus && paymentStatus !== 'approved') {
                renderPending();
                return;
            }

            // 1) Ask server to finalize (idempotent) — if webhook already did it, this just reads.
            try {
                const res = await fetch('/finalize_order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ payment_id: paymentId })
                });
                const data = await res.json();
                if (res.ok && data.ok) {
                    // Fetch the canonical order record to display
                    const orderRes = await fetch(`/orders/by-payment/${encodeURIComponent(paymentId)}`);
                    if (orderRes.ok) {
                        const order = await orderRes.json();
                        renderSuccess(order);
                        return;
                    }
                }
                // If server said "no aprobado" but MP redirected as approved → poll the webhook for a few seconds
            } catch (_) { /* fall through to polling */ }

            // 2) Poll up to 10 attempts (every 1.5s) to see if the webhook lands the order
            let attempts = 0;
            const poll = async () => {
                attempts++;
                try {
                    const r = await fetch(`/orders/by-payment/${encodeURIComponent(paymentId)}`);
                    if (r.ok) {
                        const order = await r.json();
                        renderSuccess(order);
                        return;
                    }
                } catch (_) {}
                if (attempts < 10) {
                    msg.textContent = `Esperando confirmación... (${attempts}/10)`;
                    setTimeout(poll, 1500);
                } else {
                    renderPending();
                }
            };
            setTimeout(poll, 1500);
        })();
    </script>
</body>
</html>
